<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Etmita</title>
  <desc id="d">Compliant B2B software for Europe</desc>
  <defs>
    <linearGradient id="flame" gradientUnits="userSpaceOnUse" x1="72" x2="640" y1="0" y2="0">
      <stop offset="0" stop-color="#f2453d"/>
      <stop offset=".5" stop-color="#ff6b1f"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff6b1f" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff6b1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#000000" stroke-opacity=".05"/>
    </pattern>
    <style>
      .word { font: 800 104px/1 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -4px; }
      .tag  { font: 500 26px/1 ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5c5650; }
      .chip { font: 600 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace; fill: #2a2622; letter-spacing: .5px; }
      .in   { animation: in .9s cubic-bezier(.2,.7,.2,1) backwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
      .d4 { animation-delay: .9s }  .d5 { animation-delay: 1.05s }
      @keyframes in { from { transform: translateY(10px) } to { transform: none } }
      .orb  { animation: drift 9s ease-in-out infinite alternate; transform-origin: center; }
      @keyframes drift { from { transform: translate(0,0) scale(1) } to { transform: translate(-60px,20px) scale(1.15) } }
      .shine { stroke-dasharray: 60 600; animation: shine 3.2s ease-in-out infinite; }
      @keyframes shine { from { stroke-dashoffset: 60 } to { stroke-dashoffset: -600 } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) {
        .in, .shine { animation: none }
        .orb, .pulse { animation: none }
      }
    </style>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#fbfaf9"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle class="orb" cx="980" cy="120" r="260" fill="url(#glow)"/>
  <g transform="translate(72 0)">
    <text class="word in d1" x="0" y="170" fill="url(#flame)">etmita</text>
    <path d="M4 200H520" stroke="url(#flame)" stroke-width="4" stroke-linecap="round"/>
    <path class="shine" d="M4 200H520" stroke="#fff" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
    <text class="tag in d2" x="0" y="252">Compliant B2B software for Europe. Built in Germany.</text>
  </g>
  <g transform="translate(870 214)">
    <g class="in d3"><rect width="236" height="36" rx="18" fill="#000000" fill-opacity=".04" stroke="#000000" stroke-opacity=".1"/><circle class="pulse" cx="20" cy="18" r="5" fill="#ff6b1f"/><text class="chip" x="36" y="23">PASSFEST · DPP / ESPR</text></g>
    <g transform="translate(0 46)"><g class="in d4"><rect width="236" height="36" rx="18" fill="#000000" fill-opacity=".04" stroke="#000000" stroke-opacity=".1"/><circle class="pulse" cx="20" cy="18" r="5" fill="#f2453d" style="animation-delay:.8s"/><text class="chip" x="36" y="23">MITABASE · DISPATCH</text></g></g>
  </g>
</svg>
